server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The SPA owns its routes — deep links like /orders must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded product photos, served by the api container off its media volume.
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Same-origin API, so the browser never needs CORS in the packaged app.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
