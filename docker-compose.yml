services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tulsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tulsi}
      POSTGRES_DB: ${POSTGRES_DB:-tulsi_pos}
    volumes:
      - tulsi_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tulsi} -d ${POSTGRES_DB:-tulsi_pos}"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://tulsi:tulsi@db:5432/tulsi_pos}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      UPI_ID: ${UPI_ID:-tulsitiffins@upi}
      UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-Tulsi Tiffins}
      GST_RATE: ${GST_RATE:-0.05}
      SEED_ON_START: "true"
      MEDIA_ROOT: /srv/media
    volumes:
      - tulsi_media:/srv/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  tulsi_db_data:
  tulsi_media:
